name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.3.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yfwu2020/dsh-opencode-go-second' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (name !== 'dsh-opencode-go-second' || !/^\d+\.\d+\.\d+$/.test(version) ||
              process.env.RELEASE_TAG !== `v${version}` || lock.version !== version ||
              lock.packages[''].version !== version) {
            throw new Error('Stable release tag and package/lock versions must match');
          }
          console.log(`Publishing ${name}@${version}`);
          JS
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Publish using OIDC
        run: npm publish --access public --tag latest --ignore-scripts
